server {
    listen 80;

    # Serve the Pala CSS override directly from nginx
    location = /pala.css {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # Proxy all other requests to Firefly, injecting the CSS link
    location / {
        proxy_pass         http://firefly:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Inject <link> before </head> on every HTML response
        proxy_set_header   Accept-Encoding   "";
        sub_filter         '</head>' '<link rel="stylesheet" href="/pala.css"></head>';
        sub_filter_once    on;
        sub_filter_types   text/html;
    }
}
