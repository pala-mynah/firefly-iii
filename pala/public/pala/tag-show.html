<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tag — Firefly III · Pala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="pala-shell.css">
<style>
.tag-hero { padding:1.5rem 1.4rem; }
.tag-hero .tag-title { font-family:'Crimson Pro',serif; font-size:2rem; margin:0 0 .25rem; display:flex; align-items:center; gap:.5rem; }
.tag-hero .tag-title .tag-glyph { color:var(--pala-mint); }
.tag-hero .tag-meta-row { display:flex; gap:.65rem; flex-wrap:wrap; color:var(--pala-muted); font-size:.85rem; }
.kpi-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:.75rem; padding:.85rem 1.1rem 1.1rem; }
.kpi-grid .kpi { background:var(--pala-navy); border:1px solid var(--pala-navy-border); border-radius:6px; padding:.65rem .8rem; }
.kpi .kpi-label { color:var(--pala-muted); font-size:.74rem; text-transform:uppercase; letter-spacing:.04em; }
.kpi .kpi-value { font-family:'Crimson Pro',serif; font-size:1.45rem; font-variant-numeric:tabular-nums; }
.bar-row { display:flex; align-items:center; gap:.7rem; padding:.4rem 0; }
.bar-row .bar-name { width:38%; color:var(--pala-text); font-size:.86rem; }
.bar-row .bar { flex:1; height:.65rem; background:var(--pala-navy); border-radius:3px; overflow:hidden; position:relative; }
.bar-row .bar-fill { height:100%; background:var(--pala-mint); }
.bar-row .bar-val { width:90px; text-align:right; color:var(--pala-text); font-variant-numeric:tabular-nums; font-size:.84rem; }
</style>
</head>
<body data-page="tag-show" data-sub="tags" data-crumbs="Home/Classification/Tags/Detail" data-title="Tag — Pala">

<main class="pala-main">
  <div class="card mb-3">
    <div class="tag-hero">
      <div class="tag-meta-row">
        <span data-k="tag-id-line" class="text-muted small">—</span>
      </div>
      <h1 class="tag-title"><i class="fa-solid fa-tag tag-glyph"></i> <span data-k="tag-name">Loading…</span></h1>
      <div class="text-muted small" data-k="tag-date-range">—</div>
    </div>
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-label">Transactions</div><div class="kpi-value" data-k="tag-count">—</div></div>
      <div class="kpi"><div class="kpi-label">Total spent</div><div class="kpi-value text-danger" data-k="tag-spent">—</div></div>
      <div class="kpi"><div class="kpi-label">Total income</div><div class="kpi-value text-success" data-k="tag-income">—</div></div>
      <div class="kpi"><div class="kpi-label">Net</div><div class="kpi-value" data-k="tag-net">—</div></div>
    </div>
    <div class="card-footer d-flex gap-2 flex-wrap">
      <a href="#" class="btn btn-sm btn-primary" data-k="tag-edit-btn"><i class="fa-solid fa-pencil fa-fw"></i> Edit</a>
      <div class="dropdown">
        <button class="btn btn-sm btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown"><i class="fa-solid fa-ellipsis-vertical fa-fw"></i> Actions</button>
        <ul class="dropdown-menu">
          <li><a class="dropdown-item" href="#" data-k="tag-act-rename"><i class="fa-solid fa-i-cursor"></i> Rename</a></li>
          <li><a class="dropdown-item" href="#" data-k="tag-act-export"><i class="fa-solid fa-download"></i> Export transactions (CSV)</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item text-danger" href="#" data-k="tag-act-delete"><i class="fa-solid fa-trash"></i> Delete tag</a></li>
        </ul>
      </div>
      <a href="tags.html" class="btn btn-sm btn-outline-secondary ms-auto"><i class="fa-solid fa-arrow-left fa-fw"></i> Back to tags</a>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-lg-5">
      <div class="card mb-3">
        <div class="card-header"><h3 class="card-title">Spend by category</h3></div>
        <div class="card-body" data-k="tag-by-category">
          <div class="text-muted small">Loading…</div>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><h3 class="card-title">Top counterparties</h3></div>
        <div class="card-body" data-k="tag-by-counterparty">
          <div class="text-muted small">Loading…</div>
        </div>
      </div>
    </div>
    <div class="col-lg-7">
      <div class="card">
        <div class="card-header d-flex align-items-center">
          <h3 class="card-title">Transactions</h3>
          <span class="ms-auto text-muted small" data-k="tag-tx-count">—</span>
        </div>
        <div class="table-responsive">
          <table class="table table-sm mb-0">
            <thead><tr><th>Date</th><th>Description</th><th>Counterparty</th><th class="text-end">Amount</th></tr></thead>
            <tbody data-k="tag-tx-body">
              <tr><td colspan="4" class="text-muted small">Loading transactions…</td></tr>
            </tbody>
          </table>
        </div>
        <div class="card-footer d-flex justify-content-between align-items-center">
          <span class="text-muted small" data-k="tag-tx-info">—</span>
          <a class="btn btn-sm btn-link" data-k="tag-tx-all" href="#">See all in transactions →</a>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="pala-shell.js"></script>
<script src="pala-ui.js"></script>
<script src="pala-live.js"></script>
<script src="pala-live2.js"></script>
<script src="pala-live3.js"></script>
</body>
</html>
